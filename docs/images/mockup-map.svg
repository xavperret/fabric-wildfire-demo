<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9dff0"/>
      <stop offset="100%" stop-color="#a3c4e0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background (sea) -->
  <rect width="900" height="520" fill="url(#sea)" rx="12"/>

  <!-- Title bar -->
  <rect width="900" height="48" fill="#1a1a2e" rx="12"/>
  <rect y="12" width="900" height="36" fill="#1a1a2e"/>
  <text x="20" y="31" fill="#ff6b6b" font-size="20" font-weight="bold">🔥</text>
  <text x="45" y="31" fill="white" font-size="16" font-weight="600">Fabric Wildfire Response — Live Map</text>
  <rect x="780" y="10" width="90" height="28" rx="4" fill="#e74c3c" opacity="0.9"/>
  <text x="800" y="29" fill="white" font-size="11" font-weight="600">⚡ LIVE</text>

  <!-- Recognizable France outline (l'Hexagone) -->
  <!-- Mapped from real lat/lon: lon -5..9 → x 130..690, lat 51..42 → y 60..420 -->
  <path d="
    M 295,68
    L 330,60 370,65 410,58 445,62 480,68 500,72
    L 530,65 555,70 575,78 590,72 610,80
    L 625,88 635,100 640,115 645,130
    L 660,145 670,165 680,185 685,200
    L 688,220 690,240 685,260
    L 678,280 670,300 665,315 660,330
    L 650,345 640,360 625,375 610,385
    L 590,395 570,400 550,408
    L 530,415 510,418 490,420
    L 470,418 450,412 430,405
    L 410,395 390,385 370,378
    L 345,370 325,368 305,372
    L 285,380 265,390 248,398
    L 235,395 225,385 218,370
    L 210,355 205,340 200,325
    L 195,310 190,295 188,280
    L 185,265 180,248 178,230
    L 180,210 185,195 190,180
    L 195,165 200,150 208,135
    L 218,120 225,108
    L 210,100 200,92 195,85 200,78
    L 215,72 230,68 245,65 260,62
    L 270,60 280,62 290,66 295,68
    Z"
    fill="#e8e4c9" stroke="#b0a990" stroke-width="2" filter="url(#shadow)"/>

  <!-- Brittany peninsula (more detail) -->
  <path d="
    M 200,150 L 185,148 170,152 155,155 142,160 135,168
    L 132,175 138,182 148,185 160,183 172,178
    L 185,172 195,165 200,150 Z"
    fill="#e8e4c9" stroke="#b0a990" stroke-width="1.5"/>

  <!-- Corsica -->
  <path d="
    M 665,345 L 670,340 675,345 680,355 682,370 680,385 675,395 670,398 665,390 662,375 660,360 662,350 665,345 Z"
    fill="#e8e4c9" stroke="#b0a990" stroke-width="1.5"/>

  <!-- Country labels (neighbors) -->
  <text x="400" y="52" fill="#7899b5" font-size="10" opacity="0.6">ENGLISH CHANNEL</text>
  <text x="700" y="150" fill="#7899b5" font-size="9" opacity="0.5">GERMANY</text>
  <text x="705" y="250" fill="#7899b5" font-size="9" opacity="0.5">SWITZERLAND</text>
  <text x="660" y="420" fill="#7899b5" font-size="9" opacity="0.5">ITALY</text>
  <text x="350" y="438" fill="#7899b5" font-size="9" opacity="0.5">SPAIN</text>
  <text x="120" y="260" fill="#7899b5" font-size="10" opacity="0.5">ATLANTIC</text>
  <text x="120" y="275" fill="#7899b5" font-size="10" opacity="0.5">OCEAN</text>
  <text x="520" y="445" fill="#7899b5" font-size="9" opacity="0.5">MEDITERRANEAN SEA</text>

  <!-- Major cities (faint dots) -->
  <circle cx="390" cy="130" r="3" fill="#999" opacity="0.4"/>
  <text x="398" y="134" fill="#888" font-size="8" opacity="0.5">Paris</text>
  <circle cx="630" cy="180" r="2" fill="#999" opacity="0.3"/>
  <text x="637" y="184" fill="#888" font-size="7" opacity="0.4">Strasbourg</text>
  <circle cx="520" cy="200" r="2" fill="#999" opacity="0.3"/>
  <text x="527" y="204" fill="#888" font-size="7" opacity="0.4">Lyon</text>
  <circle cx="240" cy="280" r="2" fill="#999" opacity="0.3"/>
  <text x="247" y="284" fill="#888" font-size="7" opacity="0.4">Bordeaux</text>

  <!-- === VAR REGION (southeast coast) === -->
  <circle cx="570" cy="390" r="50" fill="#e74c3c" opacity="0.10" filter="url(#glow)"/>

  <!-- Fire: Bormes-les-Mimosas (biggest FRP) -->
  <circle cx="565" cy="388" r="18" fill="#e74c3c" opacity="0.85" stroke="#c0392b" stroke-width="2"/>
  <text x="565" y="393" text-anchor="middle" fill="white" font-size="10" font-weight="bold">1110</text>

  <!-- Fire: near Toulon -->
  <circle cx="545" cy="378" r="13" fill="#e74c3c" opacity="0.8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="545" y="382" text-anchor="middle" fill="white" font-size="9" font-weight="bold">340</text>

  <!-- Fire: Fréjus -->
  <circle cx="595" cy="380" r="14" fill="#e74c3c" opacity="0.8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="595" y="384" text-anchor="middle" fill="white" font-size="9" font-weight="bold">720</text>

  <!-- Fire: Collobrières -->
  <circle cx="572" cy="400" r="7" fill="#ff7675" opacity="0.8" stroke="#d63031" stroke-width="1"/>

  <!-- Aircraft: DRAGON83 -->
  <polygon points="618,372 612,382 624,382" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
  <text x="630" y="380" fill="#2980b9" font-size="10" font-weight="600">DRAGON83</text>

  <!-- Aircraft: PELICAN32 -->
  <polygon points="525,368 519,378 531,378" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
  <text x="495" y="364" fill="#2980b9" font-size="10" font-weight="600">PELICAN32</text>

  <!-- SDIS Units in Var -->
  <rect x="552" y="408" width="10" height="10" fill="#27ae60" stroke="#1e8449" stroke-width="1" rx="2"/>
  <text x="567" y="417" fill="#27ae60" font-size="9" font-weight="600">SDIS83</text>
  <rect x="585" y="408" width="10" height="10" fill="#27ae60" stroke="#1e8449" stroke-width="1" rx="2"/>
  <rect x="518" y="390" width="10" height="10" fill="#555" stroke="#333" stroke-width="1" rx="2"/>
  <text x="500" y="398" fill="#555" font-size="8">Engaged</text>

  <!-- Var label -->
  <rect x="548" y="425" width="80" height="20" rx="4" fill="#2c3e50" opacity="0.85"/>
  <text x="588" y="439" text-anchor="middle" fill="white" font-size="10" font-weight="600">📍 Var</text>

  <!-- === FONTAINEBLEAU REGION (south of Paris) === -->
  <circle cx="410" cy="160" r="35" fill="#e74c3c" opacity="0.10" filter="url(#glow)"/>

  <!-- Fire: Fontainebleau main -->
  <circle cx="408" cy="158" r="14" fill="#e74c3c" opacity="0.85" stroke="#c0392b" stroke-width="1.5"/>
  <text x="408" y="162" text-anchor="middle" fill="white" font-size="9" font-weight="bold">280</text>

  <!-- Fire: Nemours -->
  <circle cx="395" cy="175" r="10" fill="#e74c3c" opacity="0.75" stroke="#c0392b" stroke-width="1"/>
  <text x="395" y="179" text-anchor="middle" fill="white" font-size="8" font-weight="bold">150</text>

  <!-- Fire: near Melun -->
  <circle cx="418" cy="145" r="7" fill="#ff7675" opacity="0.7" stroke="#d63031" stroke-width="1"/>

  <!-- Aircraft: PELICAN44 -->
  <polygon points="438,148 432,158 444,158" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
  <text x="448" y="156" fill="#2980b9" font-size="10" font-weight="600">PELICAN44</text>

  <!-- SDIS Unit -->
  <rect x="380" y="188" width="10" height="10" fill="#27ae60" stroke="#1e8449" stroke-width="1" rx="2"/>
  <text x="395" y="197" fill="#27ae60" font-size="9" font-weight="600">SDIS77</text>

  <!-- Fontainebleau label -->
  <rect x="365" y="205" width="110" height="20" rx="4" fill="#2c3e50" opacity="0.85"/>
  <text x="420" y="219" text-anchor="middle" fill="white" font-size="10" font-weight="600">📍 Fontainebleau</text>

  <!-- === LEGEND === -->
  <rect x="20" y="60" width="155" height="140" rx="8" fill="white" opacity="0.92" filter="url(#shadow)"/>
  <text x="32" y="80" fill="#2c3e50" font-size="12" font-weight="bold">Legend</text>
  <line x1="32" y1="86" x2="160" y2="86" stroke="#eee" stroke-width="1"/>
  <circle cx="40" cy="102" r="6" fill="#e74c3c" opacity="0.8"/>
  <text x="52" y="106" fill="#333" font-size="10">Fire (size = FRP)</text>
  <polygon points="40,118 35,127 45,127" fill="#2980b9"/>
  <text x="52" y="126" fill="#333" font-size="10">Aircraft</text>
  <rect x="35" y="137" width="9" height="9" fill="#27ae60" rx="2"/>
  <text x="52" y="146" fill="#333" font-size="10">SDIS unit (free)</text>
  <rect x="35" y="155" width="9" height="9" fill="#555" rx="2"/>
  <text x="52" y="164" fill="#333" font-size="10">SDIS (engaged)</text>
  <circle cx="40" cy="182" r="5" fill="#e74c3c" opacity="0.12"/>
  <circle cx="40" cy="182" r="2.5" fill="#e74c3c" opacity="0.4"/>
  <text x="52" y="186" fill="#333" font-size="10">Threat radius</text>

  <!-- === BUTTONS === -->
  <rect x="20" y="468" width="140" height="32" rx="6" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="90" y="489" text-anchor="middle" fill="white" font-size="12" font-weight="600">🔥 Simulate alert</text>

  <rect x="175" y="468" width="105" height="32" rx="6" fill="#3498db" filter="url(#shadow)"/>
  <text x="227" y="489" text-anchor="middle" fill="white" font-size="12" font-weight="600">📍 Zoom Var</text>

  <rect x="295" y="468" width="158" height="32" rx="6" fill="#3498db" filter="url(#shadow)"/>
  <text x="374" y="489" text-anchor="middle" fill="white" font-size="12" font-weight="600">📍 Zoom Fontainebleau</text>

  <!-- Coordinates -->
  <text x="780" y="500" fill="#7f8c8d" font-size="10">46.5°N — 2.5°E</text>
  <text x="830" y="485" fill="#95a5a6" font-size="9">zoom: 6</text>

  <!-- Attribution -->
  <text x="20" y="512" fill="#aaa" font-size="9">© OpenStreetMap contributors · Leaflet</text>
</svg>
