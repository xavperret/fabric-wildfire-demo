<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9dff0"/>
      <stop offset="100%" stop-color="#a3c4e0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background (sea) -->
  <rect width="900" height="520" fill="url(#sea)" rx="12"/>

  <!-- Title bar -->
  <rect width="900" height="48" fill="#1a1a2e" rx="12"/>
  <rect y="12" width="900" height="36" fill="#1a1a2e"/>
  <text x="20" y="31" fill="#ff6b6b" font-size="20" font-weight="bold">🔥</text>
  <text x="45" y="31" fill="white" font-size="16" font-weight="600">Fabric Wildfire Response — Live Map</text>
  <rect x="780" y="10" width="90" height="28" rx="4" fill="#e74c3c" opacity="0.9"/>
  <text x="800" y="29" fill="white" font-size="11" font-weight="600">⚡ LIVE</text>

  <!-- France mainland (real GeoJSON data, 121 points) -->
  <path d="M626,202 L620,209 L602,221 L590,243 L592,247 L607,240 L618,249 L617,259 L621,269 L624,280 L610,286 L622,295 L618,306 L627,315 L645,316 L640,327 L630,333 L619,340 L607,347 L603,351 L590,355 L582,353 L574,351 L562,348 L554,345 L543,342 L528,341 L494,347 L478,368 L479,374 L462,379 L443,378 L430,369 L414,366 L395,361 L380,367 L363,363 L346,362 L327,356 L319,348 L307,343 L319,324 L328,300 L326,297 L327,276 L324,262 L330,252 L322,242 L302,234 L294,216 L281,210 L278,204 L276,200 L272,202 L267,201 L271,198 L266,198 L262,199 L257,199 L253,196 L254,194 L249,195 L246,191 L241,190 L235,191 L227,189 L220,187 L217,189 L211,189 L198,183 L213,182 L204,177 L206,175 L217,176 L214,173 L214,170 L196,173 L197,167 L203,165 L209,163 L221,161 L227,162 L235,161 L242,157 L253,157 L257,159 L265,162 L277,165 L288,163 L295,164 L296,164 L305,164 L311,157 L311,148 L303,138 L303,127 L323,128 L340,139 L378,135 L393,121 L429,110 L425,93 L444,82 L463,86 L478,90 L490,99 L502,105 L518,107 L519,116 L538,114 L545,119 L558,127 L573,132 L589,135 L605,137 L617,143 L636,145 L657,150 L650,168 L642,200 L629,202 Z"
    fill="#e8e4c9" stroke="#b0a990" stroke-width="2" filter="url(#shadow)"/>

  <!-- Corsica (real GeoJSON data) -->
  <path d="M708,396 L707,402 L704,405 L704,407 L702,411 L699,412 L696,410 L693,408 L687,406 L688,403 L686,400 L683,398 L687,394 L680,393 L684,389 L679,386 L678,383 L682,381 L679,379 L680,377 L682,373 L685,371 L690,369 L696,367 L703,367 L705,362 L706,356 L711,359 L710,367 L713,379 L709,393 Z"
    fill="#e8e4c9" stroke="#b0a990" stroke-width="1.5"/>

  <!-- Country/sea labels -->
  <text x="370" y="58" fill="#7899b5" font-size="10" opacity="0.6">ENGLISH CHANNEL</text>
  <text x="700" y="155" fill="#7899b5" font-size="9" opacity="0.5">GERMANY</text>
  <text x="680" y="250" fill="#7899b5" font-size="9" opacity="0.5">SWITZERLAND</text>
  <text x="720" y="410" fill="#7899b5" font-size="9" opacity="0.5">ITALY</text>
  <text x="380" y="410" fill="#7899b5" font-size="9" opacity="0.5">SPAIN</text>
  <text x="120" y="260" fill="#7899b5" font-size="10" opacity="0.5">ATLANTIC</text>
  <text x="120" y="275" fill="#7899b5" font-size="10" opacity="0.5">OCEAN</text>
  <text x="530" y="420" fill="#7899b5" font-size="9" opacity="0.5">MEDITERRANEAN</text>

  <!-- Major cities (faint) -->
  <circle cx="454" cy="156" r="3" fill="#999" opacity="0.4"/>
  <text x="462" y="160" fill="#888" font-size="8" opacity="0.5">Paris</text>
  <circle cx="543" cy="262" r="2" fill="#999" opacity="0.3"/>
  <text x="550" y="266" fill="#888" font-size="7" opacity="0.4">Lyon</text>
  <circle cx="348" cy="293" r="2" fill="#999" opacity="0.3"/>
  <text x="330" y="290" fill="#888" font-size="7" opacity="0.4">Bordeaux</text>
  <circle cx="649" cy="165" r="2" fill="#999" opacity="0.3"/>
  <text x="655" y="169" fill="#888" font-size="7" opacity="0.4">Strasbourg</text>

  <!-- === VAR REGION (SE coast — Toulon/Bormes/Fréjus) === -->
  <circle cx="590" cy="350" r="45" fill="#e74c3c" opacity="0.10" filter="url(#glow)"/>

  <!-- Fire: Bormes-les-Mimosas (FRP 1110, biggest) -->
  <circle cx="598" cy="351" r="18" fill="#e74c3c" opacity="0.85" stroke="#c0392b" stroke-width="2"/>
  <text x="598" y="356" text-anchor="middle" fill="white" font-size="10" font-weight="bold">1110</text>

  <!-- Fire: Toulon (FRP 340) -->
  <circle cx="583" cy="352" r="13" fill="#e74c3c" opacity="0.8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="583" y="356" text-anchor="middle" fill="white" font-size="9" font-weight="bold">340</text>

  <!-- Fire: Fréjus (FRP 720) -->
  <circle cx="612" cy="342" r="14" fill="#e74c3c" opacity="0.8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="612" y="346" text-anchor="middle" fill="white" font-size="9" font-weight="bold">720</text>

  <!-- Fire: Collobrières (small) -->
  <circle cx="592" cy="362" r="7" fill="#ff7675" opacity="0.8" stroke="#d63031" stroke-width="1"/>

  <!-- Aircraft: DRAGON83 -->
  <polygon points="635,338 629,348 641,348" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
  <text x="645" y="346" fill="#2980b9" font-size="10" font-weight="600">DRAGON83</text>

  <!-- Aircraft: PELICAN32 -->
  <polygon points="560,342 554,352 566,352" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
  <text x="530" y="338" fill="#2980b9" font-size="10" font-weight="600">PELICAN32</text>

  <!-- SDIS units Var -->
  <rect x="580" y="370" width="10" height="10" fill="#27ae60" stroke="#1e8449" stroke-width="1" rx="2"/>
  <text x="595" y="379" fill="#27ae60" font-size="9" font-weight="600">SDIS83</text>
  <rect x="610" y="370" width="10" height="10" fill="#27ae60" stroke="#1e8449" stroke-width="1" rx="2"/>
  <rect x="565" y="365" width="10" height="10" fill="#555" stroke="#333" stroke-width="1" rx="2"/>
  <text x="548" y="373" fill="#555" font-size="8">Engaged</text>

  <!-- Var label -->
  <rect x="570" y="388" width="70" height="20" rx="4" fill="#2c3e50" opacity="0.85"/>
  <text x="605" y="402" text-anchor="middle" fill="white" font-size="10" font-weight="600">📍 Var</text>

  <!-- === FONTAINEBLEAU (south of Paris) === -->
  <circle cx="466" cy="171" r="32" fill="#e74c3c" opacity="0.10" filter="url(#glow)"/>

  <!-- Fire: Fontainebleau (FRP 280) -->
  <circle cx="466" cy="171" r="14" fill="#e74c3c" opacity="0.85" stroke="#c0392b" stroke-width="1.5"/>
  <text x="466" y="175" text-anchor="middle" fill="white" font-size="9" font-weight="bold">280</text>

  <!-- Fire: Nemours (FRP 150) -->
  <circle cx="455" cy="185" r="10" fill="#e74c3c" opacity="0.75" stroke="#c0392b" stroke-width="1"/>
  <text x="455" y="189" text-anchor="middle" fill="white" font-size="8" font-weight="bold">150</text>

  <!-- Fire: Melun (small) -->
  <circle cx="475" cy="160" r="7" fill="#ff7675" opacity="0.7" stroke="#d63031" stroke-width="1"/>

  <!-- Aircraft: PELICAN44 -->
  <polygon points="492,165 486,175 498,175" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
  <text x="502" y="173" fill="#2980b9" font-size="10" font-weight="600">PELICAN44</text>

  <!-- SDIS Unit -->
  <rect x="442" y="198" width="10" height="10" fill="#27ae60" stroke="#1e8449" stroke-width="1" rx="2"/>
  <text x="457" y="207" fill="#27ae60" font-size="9" font-weight="600">SDIS77</text>

  <!-- Fontainebleau label -->
  <rect x="425" y="215" width="110" height="20" rx="4" fill="#2c3e50" opacity="0.85"/>
  <text x="480" y="229" text-anchor="middle" fill="white" font-size="10" font-weight="600">📍 Fontainebleau</text>

  <!-- === LEGEND === -->
  <rect x="20" y="60" width="155" height="140" rx="8" fill="white" opacity="0.92" filter="url(#shadow)"/>
  <text x="32" y="80" fill="#2c3e50" font-size="12" font-weight="bold">Legend</text>
  <line x1="32" y1="86" x2="160" y2="86" stroke="#eee" stroke-width="1"/>
  <circle cx="40" cy="102" r="6" fill="#e74c3c" opacity="0.8"/>
  <text x="52" y="106" fill="#333" font-size="10">Fire (size = FRP)</text>
  <polygon points="40,118 35,127 45,127" fill="#2980b9"/>
  <text x="52" y="126" fill="#333" font-size="10">Aircraft</text>
  <rect x="35" y="137" width="9" height="9" fill="#27ae60" rx="2"/>
  <text x="52" y="146" fill="#333" font-size="10">SDIS unit (free)</text>
  <rect x="35" y="155" width="9" height="9" fill="#555" rx="2"/>
  <text x="52" y="164" fill="#333" font-size="10">SDIS (engaged)</text>
  <circle cx="40" cy="182" r="5" fill="#e74c3c" opacity="0.12"/>
  <circle cx="40" cy="182" r="2.5" fill="#e74c3c" opacity="0.4"/>
  <text x="52" y="186" fill="#333" font-size="10">Threat radius</text>

  <!-- === BUTTONS === -->
  <rect x="20" y="468" width="140" height="32" rx="6" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="90" y="489" text-anchor="middle" fill="white" font-size="12" font-weight="600">🔥 Simulate alert</text>
  <rect x="175" y="468" width="105" height="32" rx="6" fill="#3498db" filter="url(#shadow)"/>
  <text x="227" y="489" text-anchor="middle" fill="white" font-size="12" font-weight="600">📍 Zoom Var</text>
  <rect x="295" y="468" width="158" height="32" rx="6" fill="#3498db" filter="url(#shadow)"/>
  <text x="374" y="489" text-anchor="middle" fill="white" font-size="12" font-weight="600">📍 Zoom Fontainebleau</text>

  <!-- Coordinates -->
  <text x="780" y="500" fill="#7f8c8d" font-size="10">46.5°N — 2.5°E</text>
  <text x="830" y="485" fill="#95a5a6" font-size="9">zoom: 6</text>
  <text x="20" y="512" fill="#aaa" font-size="9">© OpenStreetMap contributors · Leaflet</text>
</svg>
